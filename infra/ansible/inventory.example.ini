# Example Ansible inventory.
# Copy this file to inventory.local.ini and replace placeholders.

[webservers]
web1 ansible_host=YOUR_PRODUCTION_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/YOUR_SSH_KEY.pem

[test_ec2]
test-server ansible_connection=community.aws.aws_ssm ansible_aws_ssm_instance_id=i-REPLACE_WITH_TEST_INSTANCE_ID ansible_aws_ssm_region=ap-south-1 ansible_aws_ssm_profile=terraform-lab ansible_aws_ssm_bucket_name=YOUR_SSM_TRANSFER_BUCKET ansible_python_interpreter=/usr/bin/python3
