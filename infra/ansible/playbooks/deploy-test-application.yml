---
- name: Deploy and validate application on isolated test EC2
  hosts: test_ec2
  become: true
  gather_facts: false

  vars:
    deployment_dir: /opt/devops-test

  tasks:
    - name: Deploy application using Docker Compose
      ansible.builtin.command:
        cmd: docker compose --env-file .env -f compose.yml up -d
        chdir: "{{ deployment_dir }}"
      register: compose_result
      changed_when: true

    - name: Display Docker Compose deployment result
      ansible.builtin.debug:
        var: compose_result.stdout_lines

    - name: Wait for API port 3000
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3000
        delay: 3
        timeout: 60

    - name: Check API health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/health
        method: GET
        return_content: true
        status_code: 200
      register: health_result
      retries: 6
      delay: 5
      until: health_result.status == 200

    - name: Verify API and database health
      ansible.builtin.assert:
        that:
          - health_result.json.status == "healthy"
          - health_result.json.database == "connected"
        success_msg: "API is healthy and connected to PostgreSQL."

    - name: Check application items endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/v1/items
        method: GET
        return_content: true
        status_code: 200
      register: items_result

    - name: Verify application items response
      ansible.builtin.assert:
        that:
          - items_result.json['items'] is defined
          - items_result.json.count == (items_result.json['items'] | length)
          - items_result.json.count > 0
        success_msg: "Items API is working and returning valid data."

    - name: Display deployment success
      ansible.builtin.debug:
        msg: "Test application deployment and health validation completed successfully."
