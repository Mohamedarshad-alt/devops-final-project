name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Scan API and Frontend Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            frontend/package-lock.json

      # API dependency scan
      - name: Install API dependencies
        working-directory: app
        run: npm ci

      - name: Audit API dependencies
        working-directory: app
        run: npm audit --audit-level=high

      # Frontend dependency scan
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  source-scan:
    name: Scan API and Frontend Source Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Scan application source code
        run: semgrep scan --config auto app/src frontend/src

  container-scan:
    name: Scan API and Frontend Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build API image
      - name: Build API Docker image
        run: docker build -f docker/Dockerfile -t devops-final-api:scan .

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-final-api:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Build frontend Nginx image
      - name: Build frontend Docker image
        run: docker build -f nginx/Dockerfile -t devops-final-frontend:scan .

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-final-frontend:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  secret-scan:
    name: Scan Repository for Exposed Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
