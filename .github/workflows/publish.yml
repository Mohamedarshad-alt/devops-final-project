name: Validate, Publish and Deploy Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # JOB 1: VALIDATE AND SCAN
  # ==========================================
  validate:
    name: Test and scan application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # API validation
      - name: Set up Node.js for API
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install API dependencies
        working-directory: app
        run: npm ci

      - name: Run API tests
        working-directory: app
        run: npm test

      - name: Check API JavaScript syntax
        working-directory: app
        run: |
          node --check src/app.js
          node --check src/server.js

      - name: Audit API dependencies
        working-directory: app
        run: npm audit --audit-level=high

      # Frontend validation
      - name: Set up Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      # Source security scanning
      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Scan API and frontend source
        run: semgrep scan --config auto app/src frontend/src

      # API Docker image security scanning
      - name: Build API Docker image for scanning
        run: docker build -f docker/Dockerfile -t devops-final-api:scan .

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-final-api:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Frontend Docker image security scanning
      - name: Build frontend Docker image for scanning
        run: docker build -f nginx/Dockerfile -t devops-final-frontend:scan .

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-final-frontend:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # ==========================================
  # JOB 2: PUBLISH BOTH IMAGES TO GHCR
  # ==========================================
  publish:
    name: Publish API and frontend images
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # API image metadata
      - name: Prepare API image name
        id: api-image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.api-image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long,prefix=sha-

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend image metadata
      - name: Generate frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mohamedarshad-alt/devops-final-project-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long,prefix=sha-

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # ==========================================
  # JOB 3: TEST FRONTEND DEPLOYMENT
  # FIRST DEPLOYMENT + AUTOMATIC ROLLBACK
  # ==========================================
  deploy-test:
    name: Deploy frontend to TEST EC2
    environment: test
    needs: publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::788516091241:role/GitHubActionsDevOpsDeployRole
          aws-region: ap-south-1

      - name: Deploy frontend with automatic rollback
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          NEW_IMAGE="ghcr.io/mohamedarshad-alt/devops-final-project-frontend:sha-${DEPLOY_SHA}"

          echo "======================================"
          echo "TEST FRONTEND DEPLOYMENT"
          echo "======================================"
          echo "Frontend image: ${NEW_IMAGE}"

          SCRIPT=$(cat <<'REMOTE_SCRIPT'
          set -eu

          cd /opt/devops-test

          # Stage incoming Compose files without replacing active files.

          BASE_COMPOSE_B64="__BASE_COMPOSE_B64__"
          printf '%s' "$BASE_COMPOSE_B64" | base64 -d > compose.yml.candidate
          chmod 600 compose.yml.candidate

          TEST_COMPOSE_B64="__TEST_COMPOSE_B64__"
          printf '%s' "$TEST_COMPOSE_B64" | base64 -d > docker-compose.test-frontend.yml.candidate
          chmod 600 docker-compose.test-frontend.yml.candidate

          NEW_IMAGE="__NEW_IMAGE__"

          COMPOSE_CANDIDATE="docker compose --env-file .env -f compose.yml.candidate -f docker-compose.test-frontend.yml.candidate"

          # Remove temporary files if this script exits before activating them.
          trap 'rm -f compose.yml.candidate docker-compose.test-frontend.yml.candidate' EXIT

          echo "Validating staged Docker Compose configuration..."

          if ! NGINX_IMAGE="$NEW_IMAGE" $COMPOSE_CANDIDATE config --quiet; then
            echo "ERROR: Staged Docker Compose configuration is invalid."
            exit 1
          fi

          echo "Staged Docker Compose configuration is valid."

          echo "Checking existing API and database containers..."

          API_BEFORE=$($COMPOSE_CANDIDATE ps -q api)
          DB_BEFORE=$($COMPOSE_CANDIDATE ps -q db)

          if [ -z "$API_BEFORE" ] || [ -z "$DB_BEFORE" ]; then
            echo "ERROR: Existing API or database container is missing."
            exit 1
          fi

          echo "API container: $API_BEFORE"
          echo "Database container: $DB_BEFORE"

          # --------------------------------------
          # Detect existing Nginx deployment
          # --------------------------------------

          NGINX_BEFORE=$($COMPOSE_CANDIDATE ps -q nginx)
          PREVIOUS_IMAGE=""

          if [ -n "$NGINX_BEFORE" ]; then
            echo "Existing Nginx container found."

            OLD_IMAGE_ID=$(docker inspect --format '{{.Image}}' "$NGINX_BEFORE")

            PREVIOUS_IMAGE=$(docker image inspect \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "$OLD_IMAGE_ID" |
              grep '^ghcr.io/mohamedarshad-alt/devops-final-project-frontend@sha256:' |
              head -n 1 || true)

            if [ -z "$PREVIOUS_IMAGE" ]; then
              echo "ERROR: Cannot identify the previous frontend image digest."
              echo "Aborting without changing containers."
              exit 1
            fi

            echo "Previous frontend image identified."

          else
            echo "First frontend deployment detected."
            echo "No previous Nginx container exists."
          fi

          # --------------------------------------
          # Pull image before changing active files
          # --------------------------------------

          echo "Pulling new frontend image..."

          if ! NGINX_IMAGE="$NEW_IMAGE" $COMPOSE_CANDIDATE pull nginx; then
            echo "ERROR: Frontend image pull failed."
            exit 1
          fi

          # Back up active Compose files before activating the candidates.

          echo "Preparing Compose activation backups..."

          BACKUP_DIR=$(mktemp -d .compose-activation-backup.XXXXXX)

          if ! cp -p compose.yml "$BACKUP_DIR/compose.yml" ||
             ! cp -p docker-compose.test-frontend.yml "$BACKUP_DIR/docker-compose.test-frontend.yml"; then
            echo "ERROR: Could not back up active Compose files."
            exit 1
          fi

          echo "Activating validated Compose files..."

          if ! mv -f compose.yml.candidate compose.yml; then
            echo "ERROR: Could not activate the base Compose file."
            rm -f "$BACKUP_DIR/compose.yml" "$BACKUP_DIR/docker-compose.test-frontend.yml"
            rmdir "$BACKUP_DIR"
            exit 1
          fi

          if ! mv -f docker-compose.test-frontend.yml.candidate docker-compose.test-frontend.yml; then
            echo "ERROR: Could not activate the frontend overlay."
            echo "Restoring the original base Compose file..."

            if cp -p "$BACKUP_DIR/compose.yml" compose.yml; then
              echo "Original base Compose file restored."
              rm -f "$BACKUP_DIR/compose.yml" "$BACKUP_DIR/docker-compose.test-frontend.yml"
              rmdir "$BACKUP_DIR"
            else
              echo "CRITICAL: Automatic restoration failed."
              echo "Backup files retained in: $BACKUP_DIR"
            fi

            exit 1
          fi

          # Both files are now activated successfully.
          rm -f "$BACKUP_DIR/compose.yml" "$BACKUP_DIR/docker-compose.test-frontend.yml"
          rmdir "$BACKUP_DIR"

          COMPOSE="docker compose --env-file .env -f compose.yml -f docker-compose.test-frontend.yml"

          # --------------------------------------
          # Rollback function
          # --------------------------------------

          rollback() {
            echo "======================================"
            echo "STARTING FRONTEND ROLLBACK"
            echo "======================================"

            if [ -n "$PREVIOUS_IMAGE" ]; then

              echo "Restoring previous frontend image..."

              if ! NGINX_IMAGE="$PREVIOUS_IMAGE" $COMPOSE up -d --no-deps nginx; then
                echo "CRITICAL: Previous frontend could not be restored."
                $COMPOSE logs --tail=100 nginx || true
                exit 1
              fi

              for i in $(seq 1 30); do
                if curl -fsS http://127.0.0.1:80/ >/dev/null &&
                   curl -fsS http://127.0.0.1:80/health >/dev/null; then

                  echo "Previous frontend restored successfully."
                  exit 1
                fi

                sleep 2
              done

              echo "CRITICAL: Previous frontend health check failed."
              $COMPOSE logs --tail=100 nginx || true
              exit 1

            else

              echo "First deployment failed."
              echo "Removing only the newly created Nginx container..."

              $COMPOSE rm -sf nginx || true

              echo "First-deployment rollback completed."
              echo "API and PostgreSQL containers were not targeted."
              echo "Database volume was not removed."

              exit 1
            fi
          }

          # --------------------------------------
          # Deploy frontend only
          # --------------------------------------

          echo "Deploying frontend only..."

          if ! NGINX_IMAGE="$NEW_IMAGE" $COMPOSE up -d --no-deps nginx; then
            echo "ERROR: Frontend deployment command failed."
            rollback
          fi

          # --------------------------------------
          # Website and API health checks
          # --------------------------------------

          echo "Checking website and API health..."

          for i in $(seq 1 30); do

            if curl -fsS http://127.0.0.1:80/ >/dev/null &&
               curl -fsS http://127.0.0.1:80/health >/dev/null; then

              echo "Website and API health checks passed."

              # Confirm API and DB were not restarted.

              API_AFTER=$($COMPOSE ps -q api)
              DB_AFTER=$($COMPOSE ps -q db)

              if [ "$API_BEFORE" != "$API_AFTER" ] ||
                 [ "$DB_BEFORE" != "$DB_AFTER" ]; then

                echo "ERROR: API or database container changed unexpectedly."
                rollback
              fi

              echo "API and database containers remain unchanged."

              # ----------------------------------
              # Protected endpoint checks
              # ----------------------------------

              echo "Checking protected monitoring endpoints..."

              METRICS_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
                http://127.0.0.1:80/metrics)

              PROMETHEUS_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
                http://127.0.0.1:80/prometheus/)

              GRAFANA_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
                http://127.0.0.1:80/grafana/)

              if [ "$METRICS_STATUS" != "404" ] ||
                 [ "$PROMETHEUS_STATUS" != "404" ] ||
                 [ "$GRAFANA_STATUS" != "404" ]; then

                echo "ERROR: A protected monitoring endpoint is accessible."
                echo "Rolling back frontend..."
                rollback
              fi

              echo "Protected monitoring endpoints returned 404."

              # ----------------------------------
              # Save successfully deployed image
              # ----------------------------------

              echo "Saving successfully deployed frontend image..."

              ENV_TMP=$(mktemp .env.frontend.XXXXXX) || {
                echo "ERROR: Could not create temporary environment file."
                rollback
              }

              if ! {
                cp .env "$ENV_TMP" &&
                if grep -q '^NGINX_IMAGE=' "$ENV_TMP"; then
                  sed -i "s|^NGINX_IMAGE=.*|NGINX_IMAGE=$NEW_IMAGE|" "$ENV_TMP"
                else
                  printf '%s\n' "NGINX_IMAGE=$NEW_IMAGE" >> "$ENV_TMP"
                fi &&
                chmod 600 "$ENV_TMP" &&
                mv -f "$ENV_TMP" .env
              }; then
                echo "ERROR: Could not save frontend image configuration."
                rm -f "$ENV_TMP"
                rollback
              fi

              echo "======================================"
              echo "FRONTEND DEPLOYMENT SUCCESSFUL"
              echo "======================================"
              echo "Frontend image: $NEW_IMAGE"
              echo "API container unchanged."
              echo "Database container unchanged."
              echo "Database volume preserved."

              exit 0
            fi

            sleep 2
          done

          # --------------------------------------
          # Health check failure
          # --------------------------------------

          echo "ERROR: Frontend or API health check failed."

          $COMPOSE logs --tail=80 nginx || true

          rollback

          REMOTE_SCRIPT
          )

          SCRIPT="${SCRIPT//__NEW_IMAGE__/$NEW_IMAGE}"

          BASE_COMPOSE_B64=$(base64 -w0 infra/ansible/files/test-compose.yml)
          SCRIPT="${SCRIPT//__BASE_COMPOSE_B64__/$BASE_COMPOSE_B64}"

          TEST_COMPOSE_B64=$(base64 -w0 docker-compose.test-frontend.yml)
          SCRIPT="${SCRIPT//__TEST_COMPOSE_B64__/$TEST_COMPOSE_B64}"

          jq -n --arg script "$SCRIPT" \
            '{commands: [$script]}' > ssm-parameters.json

          # --------------------------------------
          # Send deployment command through SSM
          # --------------------------------------

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0c4f68769d3bd1b69 \
            --document-name AWS-RunShellScript \
            --comment "Test frontend deployment ${DEPLOY_SHA}" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          # --------------------------------------
          # Monitor SSM command status
          # --------------------------------------

          for attempt in $(seq 1 120); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0c4f68769d3bd1b69 \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in

              Success)
                echo "Test deployment succeeded."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0c4f68769d3bd1b69 \
                  --query 'StandardOutputContent' \
                  --output text

                exit 0
                ;;

              Failed|TimedOut|Cancelled|Cancelling)
                echo "Test deployment failed: $STATUS"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0c4f68769d3bd1b69 \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json

                exit 1
                ;;

            esac

            sleep 5
          done

          echo "Timed out waiting for the test deployment."
          exit 1
  deploy:
    name: Deploy to EC2 with automatic rollback
    environment: production
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::788516091241:role/GitHubActionsDevOpsDeployRole
          aws-region: ap-south-1

      - name: Deploy with automatic rollback
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          NEW_IMAGE="ghcr.io/mohamedarshad-alt/devops-final-project:sha-${DEPLOY_SHA}"

          echo "Image to deploy: ${NEW_IMAGE}"

          SCRIPT=$(cat <<'REMOTE_SCRIPT'
          set -eu

          cd /home/ubuntu/devops-app

          NEW_IMAGE="__NEW_IMAGE__"

          echo "Identifying the currently running API container..."

          CONTAINER_ID=$(docker compose ps -q api)

          if [ -z "$CONTAINER_ID" ]; then
            echo "ERROR: No API container found. Aborting safely."
            exit 1
          fi

          CURRENT_IMAGE_ID=$(docker inspect --format '{{.Image}}' "$CONTAINER_ID")

          PREVIOUS_IMAGE=$(docker image inspect \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            "$CURRENT_IMAGE_ID" |
            grep '^ghcr.io/mohamedarshad-alt/devops-final-project@sha256:' |
            head -n 1 || true)

          if [ -z "$PREVIOUS_IMAGE" ]; then
            echo "ERROR: Could not identify the previous GHCR image digest."
            echo "Aborting without changing the running application."
            exit 1
          fi

          echo "Previous image: $PREVIOUS_IMAGE"
          echo "New image: $NEW_IMAGE"

          echo "Pulling the new image..."

          if ! API_IMAGE="$NEW_IMAGE" docker compose pull api; then
            echo "ERROR: New image pull failed. Existing application remains unchanged."
            exit 1
          fi

          rollback() {
            echo "Starting rollback to the previous image..."

            if ! API_IMAGE="$PREVIOUS_IMAGE" docker compose up -d --no-deps api; then
              echo "CRITICAL: Rollback command failed."
              docker compose logs --tail=100 api || true
              exit 1
            fi

            echo "Checking previous application health..."

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/health; then
                echo
                echo "ROLLBACK SUCCESSFUL: Previous version is healthy."
                echo "Deployment failed, but the previous version was restored."
                exit 1
              fi

              sleep 2
            done

            echo "CRITICAL: Previous version failed its health check."
            docker compose logs --tail=100 api || true
            exit 1
          }

          echo "Deploying the new application image..."

          if ! API_IMAGE="$NEW_IMAGE" docker compose up -d --no-deps api; then
            echo "ERROR: New deployment command failed."
            rollback
          fi

          echo "Checking new application health..."

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then
              echo
              echo "DEPLOYMENT SUCCESSFUL: New version is healthy."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: New version failed its health check."
          docker compose logs --tail=80 api || true

          rollback
          REMOTE_SCRIPT
          )

          SCRIPT="${SCRIPT//__NEW_IMAGE__/$NEW_IMAGE}"

          jq -n --arg script "$SCRIPT" \
            '{commands: [$script]}' > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0f99bd13764bd2b42 \
            --document-name AWS-RunShellScript \
            --comment "Deploy commit ${DEPLOY_SHA} with automatic rollback" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0f99bd13764bd2b42 \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0f99bd13764bd2b42 \
                  --query 'StandardOutputContent' \
                  --output text

                exit 0
                ;;

              Failed|TimedOut|Cancelled|Cancelling)
                echo "Deployment or rollback failed: $STATUS"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0f99bd13764bd2b42 \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the SSM command."
          exit 1
