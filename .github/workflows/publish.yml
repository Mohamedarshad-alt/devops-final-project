name: Validate, Publish and Deploy Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test and scan application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run API tests
        working-directory: app
        run: npm test

      - name: Check JavaScript syntax
        working-directory: app
        run: |
          node --check src/app.js
          node --check src/server.js

      - name: Audit npm dependencies
        working-directory: app
        run: npm audit --audit-level=high

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Scan application source
        run: semgrep scan --config auto app/src

      - name: Build Docker image for scanning
        run: docker build -f docker/Dockerfile -t devops-final-api:scan .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-final-api:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: Publish image to GHCR
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long,prefix=sha-

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 with automatic rollback
    environment: production
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::788516091241:role/GitHubActionsDevOpsDeployRole
          aws-region: ap-south-1

      - name: Deploy with automatic rollback
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          NEW_IMAGE="ghcr.io/mohamedarshad-alt/devops-final-project:sha-${DEPLOY_SHA}"

          echo "Image to deploy: ${NEW_IMAGE}"

          SCRIPT=$(cat <<'REMOTE_SCRIPT'
          set -eu

          cd /home/ubuntu/devops-app

          NEW_IMAGE="__NEW_IMAGE__"

          echo "Identifying the currently running API container..."

          CONTAINER_ID=$(docker compose ps -q api)

          if [ -z "$CONTAINER_ID" ]; then
            echo "ERROR: No API container found. Aborting safely."
            exit 1
          fi

          CURRENT_IMAGE_ID=$(docker inspect --format '{{.Image}}' "$CONTAINER_ID")

          PREVIOUS_IMAGE=$(docker image inspect \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            "$CURRENT_IMAGE_ID" |
            grep '^ghcr.io/mohamedarshad-alt/devops-final-project@sha256:' |
            head -n 1 || true)

          if [ -z "$PREVIOUS_IMAGE" ]; then
            echo "ERROR: Could not identify the previous GHCR image digest."
            echo "Aborting without changing the running application."
            exit 1
          fi

          echo "Previous image: $PREVIOUS_IMAGE"
          echo "New image: $NEW_IMAGE"

          echo "Pulling the new image..."

          if ! API_IMAGE="$NEW_IMAGE" docker compose pull api; then
            echo "ERROR: New image pull failed. Existing application remains unchanged."
            exit 1
          fi

          rollback() {
            echo "Starting rollback to the previous image..."

            if ! API_IMAGE="$PREVIOUS_IMAGE" docker compose up -d --no-deps api; then
              echo "CRITICAL: Rollback command failed."
              docker compose logs --tail=100 api || true
              exit 1
            fi

            echo "Checking previous application health..."

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/health; then
                echo
                echo "ROLLBACK SUCCESSFUL: Previous version is healthy."
                echo "Deployment failed, but the previous version was restored."
                exit 1
              fi

              sleep 2
            done

            echo "CRITICAL: Previous version failed its health check."
            docker compose logs --tail=100 api || true
            exit 1
          }

          echo "Deploying the new application image..."

          if ! API_IMAGE="$NEW_IMAGE" docker compose up -d --no-deps api; then
            echo "ERROR: New deployment command failed."
            rollback
          fi

          echo "Checking new application health..."

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then
              echo
              echo "DEPLOYMENT SUCCESSFUL: New version is healthy."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: New version failed its health check."
          docker compose logs --tail=80 api || true

          rollback
          REMOTE_SCRIPT
          )

          SCRIPT="${SCRIPT//__NEW_IMAGE__/$NEW_IMAGE}"

          jq -n --arg script "$SCRIPT" \
            '{commands: [$script]}' > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0f99bd13764bd2b42 \
            --document-name AWS-RunShellScript \
            --comment "Deploy commit ${DEPLOY_SHA} with automatic rollback" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0f99bd13764bd2b42 \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0f99bd13764bd2b42 \
                  --query 'StandardOutputContent' \
                  --output text

                exit 0
                ;;

              Failed|TimedOut|Cancelled|Cancelling)
                echo "Deployment or rollback failed: $STATUS"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0f99bd13764bd2b42 \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the SSM command."
          exit 1
