services:
  nginx:
    image: ${NGINX_IMAGE:-ghcr.io/mohamedarshad-alt/devops-final-project-frontend:main}
    restart: unless-stopped

    depends_on:
      api:
        condition: service_started

    read_only: true

    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - test-network
