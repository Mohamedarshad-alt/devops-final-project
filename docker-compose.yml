
services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - app-network

  # ==========================================
  # Node.js / Express API
  # ==========================================
  api:
    image: ${API_IMAGE:-devops-final-project-api:local}
    restart: unless-stopped

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      PORT: "3000"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - app-network

  # ==========================================
  # Node Exporter
  # ==========================================
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped

    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+)($|/)"

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

    expose:
      - "9100"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    read_only: true

    networks:
      - app-network

  # ==========================================
  # PostgreSQL Exporter
  # ==========================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped

    environment:
      DATA_SOURCE_URI: "db:5432/${POSTGRES_DB}?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_EXPORTER_USER:?POSTGRES_EXPORTER_USER is required}"
      DATA_SOURCE_PASS: "${POSTGRES_EXPORTER_PASSWORD:?POSTGRES_EXPORTER_PASSWORD is required}"

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "9187"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    networks:
      - app-network

  # ==========================================
  # Prometheus
  # ==========================================
  prometheus:
    image: prom/prometheus:v3.8.0
    restart: unless-stopped

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.external-url=http://localhost/prometheus/"
      - "--web.route-prefix=/prometheus/"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    depends_on:
      - api
      - node-exporter
      - postgres-exporter

    networks:
      - app-network

  # ==========================================
  # Grafana
  # ==========================================
  grafana:
    image: grafana/grafana:12.3.0
    restart: unless-stopped

    environment:
      GF_SERVER_ROOT_URL: "http://localhost/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    networks:
      - app-network

  # ==========================================
  # Nginx Reverse Proxy
  # ==========================================
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - api
      - prometheus
      - grafana

    read_only: true

    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

# ==========================================
# Persistent Volumes
# ==========================================
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

# ==========================================
# Docker Network
# ==========================================
networks:
  app-network:
    driver: bridge
